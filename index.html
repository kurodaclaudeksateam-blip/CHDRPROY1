<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checador — Control de Asistencia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --ink:#161B22;
    --ink-soft:#4B5563;
    --bg:#F2F0E9;
    --surface:#FFFFFF;
    --surface-2:#FAF9F4;
    --line:#DCD8CC;
    --line-soft:#E8E5DA;
    --primary:#1E3A5F;
    --primary-2:#2E5680;
    --primary-ink:#EAF1F8;
    --accent:#E2A23B;
    --accent-ink:#3A2A05;
    --success:#2E7D5B;
    --success-bg:#E4F2EA;
    --danger:#C1443C;
    --danger-bg:#FBEAE8;
    --warn:#C98A1F;
    --warn-bg:#FBF0DC;
    --info:#3C6E9A;
    --info-bg:#E7F0F7;
    --shadow-1:0 1px 2px rgba(22,27,34,.06);
    --shadow-2:0 8px 24px rgba(22,27,34,.10);
    --shadow-3:0 16px 48px rgba(22,27,34,.16);
    --radius-s:8px;
    --radius-m:14px;
    --radius-l:20px;
    --font-display:'Sora',system-ui,sans-serif;
    --font-body:'IBM Plex Sans',system-ui,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#ECEDEE;
      --ink-soft:#A9B1BC;
      --bg:#12151B;
      --surface:#1A1F27;
      --surface-2:#1F252E;
      --line:#2C3341;
      --line-soft:#242A35;
      --primary:#4C7BAD;
      --primary-2:#5F8DC0;
      --primary-ink:#0E1720;
      --accent:#E7B15C;
      --accent-ink:#2A1D02;
      --success:#4FA97E;
      --success-bg:#153226;
      --danger:#E07068;
      --danger-bg:#3A1917;
      --warn:#E0A83F;
      --warn-bg:#332508;
      --info:#6FA3CC;
      --info-bg:#132734;
      --shadow-1:0 1px 2px rgba(0,0,0,.3);
      --shadow-2:0 8px 24px rgba(0,0,0,.35);
      --shadow-3:0 16px 48px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --ink:#ECEDEE; --ink-soft:#A9B1BC; --bg:#12151B; --surface:#1A1F27; --surface-2:#1F252E;
    --line:#2C3341; --line-soft:#242A35; --primary:#4C7BAD; --primary-2:#5F8DC0; --primary-ink:#0E1720;
    --accent:#E7B15C; --accent-ink:#2A1D02; --success:#4FA97E; --success-bg:#153226; --danger:#E07068;
    --danger-bg:#3A1917; --warn:#E0A83F; --warn-bg:#332508; --info:#6FA3CC; --info-bg:#132734;
    --shadow-1:0 1px 2px rgba(0,0,0,.3); --shadow-2:0 8px 24px rgba(0,0,0,.35); --shadow-3:0 16px 48px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);}
  #app{font-family:var(--font-body);color:var(--ink);background:var(--bg);min-height:100vh;}
  svg{width:1em;height:1em;flex:none;vertical-align:-0.15em;}
  h1,h2,h3,h4{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em;}
  p{margin:0;}
  button{font-family:inherit;}
  .mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
  .hidden{display:none !important;}
  ::selection{background:var(--accent);color:var(--accent-ink);}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px;}
  @media (prefers-reduced-motion: reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important;}}

  /* ---------- boot ---------- */
  .boot-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:
    radial-gradient(1200px 500px at 15% -10%, color-mix(in srgb, var(--primary) 14%, transparent), transparent),
    var(--bg);}
  .boot-mark{width:64px;height:64px;border-radius:18px;background:linear-gradient(155deg,var(--primary),var(--primary-2));display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-2);animation:pulseRing 1.8s ease-in-out infinite;}
  .boot-mark svg{width:32px;height:32px;}
  .boot-label{font-family:var(--font-mono);font-size:13px;color:var(--ink-soft);letter-spacing:.04em;}
  @keyframes pulseRing{0%,100%{transform:scale(1);}50%{transform:scale(1.06);}}

  /* ---------- gate (login) ---------- */
  .gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px;background:
    radial-gradient(1000px 600px at 85% 0%, color-mix(in srgb, var(--accent) 12%, transparent), transparent),
    radial-gradient(900px 500px at 5% 100%, color-mix(in srgb, var(--primary) 16%, transparent), transparent),
    var(--bg);}
  .gate-card{width:100%;max-width:460px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-l);box-shadow:var(--shadow-3);padding:36px 32px 28px;animation:riseIn .5s cubic-bezier(.2,.8,.2,1) both;}
  @keyframes riseIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  .gate-brand{display:flex;align-items:center;gap:12px;margin-bottom:22px;}
  .gate-brand .mark{width:40px;height:40px;border-radius:11px;background:linear-gradient(155deg,var(--primary),var(--primary-2));display:flex;align-items:center;justify-content:center;flex:none;}
  .gate-brand .mark svg{width:22px;height:22px;color:var(--primary-ink);}
  .gate-brand .company{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;color:var(--ink-soft);text-transform:uppercase;}
  .gate-brand h1{font-size:19px;}
  .gate h2{font-size:23px;margin-bottom:6px;}
  .gate-sub{color:var(--ink-soft);font-size:14px;line-height:1.5;margin-bottom:22px;}
  .role-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px;}
  .role-btn{grid-column:span 1;display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:14px 14px;border-radius:var(--radius-m);border:1px solid var(--line);background:var(--surface-2);cursor:pointer;transition:border-color .15s,transform .15s,box-shadow .15s;text-align:left;}
  .role-btn:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:var(--shadow-1);}
  .role-btn.active{border-color:var(--primary);background:color-mix(in srgb, var(--primary) 8%, var(--surface-2));box-shadow:0 0 0 1px var(--primary) inset;}
  .role-btn svg{width:20px;height:20px;color:var(--primary);}
  .role-btn .rname{font-weight:600;font-size:13.5px;}
  .role-btn .rdesc{font-size:11.5px;color:var(--ink-soft);line-height:1.35;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em;}
  .field select,.field input,.field textarea{width:100%;padding:10px 12px;border-radius:var(--radius-s);border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:14px;font-family:inherit;}
  .field select:focus,.field input:focus,.field textarea:focus{border-color:var(--primary);}
  .field-hint{font-size:11.5px;color:var(--ink-soft);margin-top:5px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:var(--radius-s);border:1px solid transparent;font-weight:600;font-size:13.5px;cursor:pointer;transition:transform .12s,box-shadow .12s,background .15s,border-color .15s;white-space:nowrap;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:linear-gradient(155deg,var(--primary),var(--primary-2));color:var(--primary-ink);box-shadow:var(--shadow-1);}
  .btn-primary:hover{box-shadow:var(--shadow-2);}
  .btn-accent{background:var(--accent);color:var(--accent-ink);}
  .btn-accent:hover{filter:brightness(1.05);box-shadow:var(--shadow-2);}
  .btn-ghost{background:transparent;border-color:var(--line);color:var(--ink);}
  .btn-ghost:hover{border-color:var(--primary);}
  .btn-danger{background:var(--danger-bg);color:var(--danger);}
  .btn-danger:hover{filter:brightness(.97);}
  .btn-success{background:var(--success-bg);color:var(--success);}
  .btn-block{width:100%;}
  .btn-sm{padding:7px 12px;font-size:12.5px;border-radius:7px;}
  .btn[disabled]{opacity:.5;cursor:not-allowed;}
  .gate-foot{margin-top:16px;font-size:11.5px;color:var(--ink-soft);line-height:1.5;}

  .kiosk-launch{margin-top:18px;padding-top:18px;border-top:1px dashed var(--line);}
  .kiosk-launch-btn{width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--radius-m);border:1px solid color-mix(in srgb, var(--accent) 45%, var(--line));background:linear-gradient(155deg, color-mix(in srgb, var(--accent) 14%, var(--surface)), var(--surface));cursor:pointer;text-align:left;transition:transform .15s,box-shadow .15s;}
  .kiosk-launch-btn:hover{transform:translateY(-2px);box-shadow:var(--shadow-2);}
  .kiosk-launch-icon{width:38px;height:38px;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;flex:none;}
  .kiosk-launch-icon svg{width:20px;height:20px;}
  .kiosk-launch-text .klt-title{font-weight:700;font-size:13.5px;}
  .kiosk-launch-text .klt-sub{font-size:11.5px;color:var(--ink-soft);margin-top:2px;line-height:1.4;}

  /* ---------- kiosk (pantalla completa, sin sesión, cámara de fondo) ---------- */
  .kiosk-screen{min-height:100vh;position:relative;overflow:hidden;background:var(--ink);color:#fff;}
  .kiosk-video-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .kiosk-scrim{position:absolute;inset:0;background:linear-gradient(180deg, rgba(9,12,17,.6) 0%, rgba(9,12,17,.12) 28%, rgba(9,12,17,.18) 72%, rgba(9,12,17,.7) 100%);transition:background .25s;}
  .kiosk-scrim-strong{background:rgba(8,10,15,.86) !important;}
  .kiosk-overlay{position:absolute;inset:0;display:flex;flex-direction:column;}
  .kiosk-topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 26px;flex:none;}
  .kiosk-brand-mini{display:flex;align-items:center;gap:10px;pointer-events:none;}
  .kiosk-brand-mini .mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(155deg,var(--accent),color-mix(in srgb, var(--accent) 60%, white));display:flex;align-items:center;justify-content:center;flex:none;}
  .kiosk-brand-mini .mark svg{width:19px;height:19px;color:var(--accent-ink);}
  .kiosk-brand-mini .kb-title{font-family:var(--font-display);font-weight:700;font-size:14.5px;}
  .kiosk-brand-mini .kb-sub{font-family:var(--font-mono);font-size:10px;color:#c2c8d3;text-transform:uppercase;letter-spacing:.06em;}
  .kiosk-clock{font-family:var(--font-mono);font-size:21px;font-weight:600;text-align:right;color:#fff;pointer-events:none;}
  .kiosk-date{font-size:10.5px;color:#c2c8d3;text-align:right;text-transform:capitalize;pointer-events:none;}
  .kiosk-exit{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#dfe2e8;border-radius:9px;padding:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-left:12px;flex:none;}
  .kiosk-exit:hover{background:rgba(255,255,255,.2);color:#fff;}
  .kiosk-exit svg{width:16px;height:16px;display:block;}
  .kiosk-center{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;}
  .kiosk-center-msg{text-align:center;max-width:360px;}
  .kiosk-big-icon{width:60px;height:60px;margin:0 auto 16px;color:#fff;opacity:.85;}
  .kiosk-big-icon svg{width:100%;height:100%;}
  .kiosk-msg-title{font-family:var(--font-display);font-size:19px;font-weight:700;text-wrap:balance;}
  .kiosk-msg-sub{color:#c7cdd8;font-size:12.5px;margin-top:8px;line-height:1.5;}
  .kiosk-tap-hint{text-align:center;cursor:pointer;animation:tapPulse 2.6s ease-in-out infinite;padding:20px;}
  .kiosk-tap-icon{width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;}
  .kiosk-tap-icon svg{width:32px;height:32px;color:#fff;}
  .kiosk-tap-hint .kiosk-msg-title{font-size:23px;}
  @keyframes tapPulse{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.04);opacity:.88;}}
  .kiosk-verifying-ring{width:110px;height:110px;border-radius:50%;border:3px solid rgba(255,255,255,.18);border-top-color:var(--accent);margin:0 auto 18px;animation:kioskSpin 1s linear infinite;}
  @keyframes kioskSpin{to{transform:rotate(360deg);}}

  .kiosk-picker{width:100%;max-width:640px;max-height:84vh;display:flex;flex-direction:column;background:rgba(19,23,30,.94);border:1px solid rgba(255,255,255,.14);border-radius:26px;padding:24px;backdrop-filter:blur(10px);box-shadow:var(--shadow-3);animation:riseIn .25s cubic-bezier(.2,.8,.2,1) both;}
  .kiosk-search{width:100%;padding:15px 16px;border-radius:13px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;font-size:16px;font-family:inherit;}
  .kiosk-search::placeholder{color:#9aa2b0;}
  .kiosk-search:focus{border-color:var(--accent);}
  .kiosk-picker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;overflow-y:auto;margin-top:16px;padding-right:4px;flex:1;}
  .kiosk-pick-tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 8px;border-radius:16px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);cursor:pointer;color:#fff;font-family:inherit;transition:background .15s,transform .15s;}
  .kiosk-pick-tile:hover{background:rgba(255,255,255,.15);transform:translateY(-2px);}
  .kiosk-pick-tile:active{transform:translateY(0) scale(.97);}
  .kiosk-pick-avatar{width:50px;height:50px;border-radius:50%;background:var(--primary);color:var(--primary-ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;background-size:cover;background-position:center;flex:none;}
  .kiosk-pick-name{font-size:12px;font-weight:600;text-align:center;line-height:1.25;}
  .kiosk-picker-empty{grid-column:1/-1;text-align:center;color:#9aa2b0;font-size:12.5px;padding:20px 0;}

  .kiosk-result{text-align:center;background:rgba(19,23,30,.9);border:1px solid rgba(255,255,255,.14);border-radius:26px;padding:36px 42px;backdrop-filter:blur(8px);animation:kioskPop .35s cubic-bezier(.2,.8,.2,1) both;box-shadow:var(--shadow-3);}
  @keyframes kioskPop{from{opacity:0;transform:scale(.94);}to{opacity:1;transform:scale(1);}}

  /* ---------- shell ---------- */
  .shell{display:grid;grid-template-columns:216px 1fr;min-height:100vh;}
  .rail{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;}
  .rail-brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;}
  .rail-brand .mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(155deg,var(--primary),var(--primary-2));display:flex;align-items:center;justify-content:center;flex:none;}
  .rail-brand .mark svg{width:17px;height:17px;color:var(--primary-ink);}
  .rail-brand .rb-text{font-family:var(--font-display);font-weight:700;font-size:14.5px;line-height:1.15;}
  .rail-brand .rb-sub{font-family:var(--font-mono);font-size:9.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--ink-soft);font-size:13.5px;font-weight:500;cursor:pointer;border:none;background:transparent;text-align:left;width:100%;transition:background .15s,color .15s;}
  .nav-item svg{width:17px;height:17px;flex:none;}
  .nav-item:hover{background:var(--surface-2);color:var(--ink);}
  .nav-item.active{background:color-mix(in srgb, var(--primary) 12%, transparent);color:var(--primary);font-weight:600;}
  :root[data-theme="dark"] .nav-item.active, @media (prefers-color-scheme:dark){.nav-item.active{color:var(--primary-2);}}
  .rail-spacer{flex:1;}
  .rail-user{display:flex;align-items:center;gap:9px;padding:10px 8px;border-top:1px solid var(--line-soft);margin-top:6px;}
  .avatar{width:32px;height:32px;border-radius:50%;background:var(--primary);color:var(--primary-ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;flex:none;object-fit:cover;background-size:cover;background-position:center;}
  .rail-user .ru-name{font-size:12.5px;font-weight:600;line-height:1.2;}
  .rail-user .ru-role{font-size:10.5px;color:var(--ink-soft);}
  .rail-logout{background:none;border:none;color:var(--ink-soft);cursor:pointer;padding:6px;border-radius:6px;flex:none;}
  .rail-logout:hover{color:var(--danger);background:var(--danger-bg);}
  .rail-logout svg{width:15px;height:15px;display:block;}

  .main{min-width:0;}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;border-bottom:1px solid var(--line);background:color-mix(in srgb, var(--surface) 88%, transparent);backdrop-filter:blur(6px);position:sticky;top:0;z-index:5;}
  .topbar h2{font-size:18px;}
  .topbar-sub{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .clock{font-family:var(--font-mono);font-size:20px;font-weight:600;letter-spacing:.02em;}
  .clock-date{font-size:11px;color:var(--ink-soft);text-transform:capitalize;text-align:right;}
  .view{padding:26px 28px 60px;max-width:1240px;margin:0 auto;animation:fadeSlide .35s ease both;}
  @keyframes fadeSlide{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  /* ---------- kpi vcards ---------- */
  .kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px;}
  .kpi-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);padding:16px 18px;box-shadow:var(--shadow-1);position:relative;overflow:hidden;}
  .kpi-card::before{content:"";position:absolute;top:0;left:0;width:3px;height:100%;background:var(--kpi-c,var(--primary));}
  .kpi-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .kpi-icon{width:30px;height:30px;border-radius:8px;background:var(--kpi-bg,var(--info-bg));color:var(--kpi-c,var(--info));display:flex;align-items:center;justify-content:center;}
  .kpi-icon svg{width:16px;height:16px;}
  .kpi-value{font-family:var(--font-display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;}
  .kpi-label{font-size:12px;color:var(--ink-soft);margin-top:3px;}

  /* ---------- panels/cards ---------- */
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-l);box-shadow:var(--shadow-1);padding:20px 22px;margin-bottom:20px;}
  button.panel{font-family:inherit;transition:transform .15s,box-shadow .15s,border-color .15s;}
  button.panel:hover{transform:translateY(-2px);box-shadow:var(--shadow-2);border-color:var(--primary);}
  .panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px;flex-wrap:wrap;}
  .panel-head h3{font-size:15.5px;}
  .panel-head .ph-sub{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .grid-2{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;align-items:start;}
  @media (max-width:980px){.grid-2{grid-template-columns:1fr;} .kpi-row{grid-template-columns:repeat(2,1fr);} .shell{grid-template-columns:1fr;} .rail{position:relative;height:auto;flex-direction:row;flex-wrap:wrap;} .rail-spacer{display:none;}}

  .pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:600;letter-spacing:.01em;}
  .pill-success{background:var(--success-bg);color:var(--success);}
  .pill-danger{background:var(--danger-bg);color:var(--danger);}
  .pill-warn{background:var(--warn-bg);color:var(--warn);}
  .pill-info{background:var(--info-bg);color:var(--info);}
  .pill-muted{background:var(--surface-2);color:var(--ink-soft);border:1px solid var(--line);}

  /* employees */
  .emp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;}
  .vcard{border:1px solid var(--line);border-radius:var(--radius-m);padding:14px;background:var(--surface-2);display:flex;flex-direction:column;gap:10px;transition:transform .15s,box-shadow .15s,border-color .15s;}
  .vcard:hover{transform:translateY(-3px);box-shadow:var(--shadow-2);border-color:var(--primary);}
  .vcard-top{display:flex;align-items:center;gap:10px;}

<script>
(function(){
"use strict";

/* ============================================================

============================================================ */
const ICONS = {

  fileText:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h6"/>',

  inbox:'<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',

};
function icon(name){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]||''}</svg>`;}

/* ============================================================
   UTIL
============================================================ */
const $ = (sel,root)=> (root||document).querySelector(sel);
const $$ = (sel,root)=> Array.from((root||document).querySelectorAll(sel));
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function pad(n){return String(n).padStart(2,'0');}
function dateKey(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}
function monthKeyOf(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}`;}
function timeStr(d){return `${pad(d.getHours())}:${pad(d.getMinutes())}`;}
function fromKey(k){const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d);}
const DOW = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const MONTHS = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function initialsOf(name){return (name||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();}

function toast(msg,kind){
  kind = kind||'info';
  const box = document.createElement('div');
  box.className = 'toast '+kind;
  const ic = kind==='ok'?'check':kind==='err'?'x':'alert';
  box.innerHTML = `<span style="width:15px;height:15px;flex:none;">${icon(ic)}</span><span>${escapeHtml(msg)}</span>`;
  $('#toasts').appendChild(box);
  setTimeout(()=>{ box.style.transition='opacity .25s'; box.style.opacity='0'; setTimeout(()=>box.remove(),260); }, 3600);
}

function compressImage(source, size, quality){
  size = size||160; quality = quality||0.62;
  const canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  let sw = source.videoWidth||source.naturalWidth||source.width;
  let sh = source.videoHeight||source.naturalHeight||source.height;
  if(!sw||!sh){sw=size;sh=size;}
  const side = Math.min(sw,sh);
  const sx = (sw-side)/2, sy=(sh-side)/2;
  ctx.fillStyle = '#1a1f27'; ctx.fillRect(0,0,size,size);
  ctx.drawImage(source, sx, sy, side, side, 0, 0, size, size);
  return canvas.toDataURL('image/jpeg', quality);
}

function fileToImage(file){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = ()=>{ resolve(img); URL.revokeObjectURL(url); };
    img.onerror = reject;
    img.src = url;
  });
}

/* ============================================================
   STORE ABSTRACTION — real `db` capability, or a localStorage
   fallback when the page runs outside an artifact host (e.g. the
   downloaded standalone file, opened directly in a browser).
============================================================ */
const Store = (function(){
  let backend = null; // {colOnSnapshot, colGet, colAdd, docGet, docSet, docUpdate}
  let mode = 'pending';

  function makeLocalBackend(){
    const KEY = 'checador_local_db_v1';
    let memoryFallback = null; // used when localStorage is unavailable (privacy mode, sandboxed origins, etc.)
    function readAll(){
      if(memoryFallback) return memoryFallback;
      try{ return JSON.parse(localStorage.getItem(KEY)||'{}'); }
      catch(e){ memoryFallback = memoryFallback||{}; return memoryFallback; }
    }
    function writeAll(all){
      if(memoryFallback){ memoryFallback = all; return; }
      try{ localStorage.setItem(KEY, JSON.stringify(all)); }
      catch(e){ memoryFallback = all; }
    }
    const listeners = {}; // path -> Set(fn)
    function notify(path){
      (listeners[path]||new Set()).forEach(fn=>fn());
    }
    function subscribe(path, fn){
      listeners[path] = listeners[path]||new Set();
      listeners[path].add(fn);
      return ()=>listeners[path].delete(fn);
    }
    function collDocs(path){
      const all = readAll();
      const col = all[path]||{};
      return Object.keys(col).map(id=>({id, data: col[id]}));
    }
    return {
      docGet: async(path)=>{
        const {col,id} = splitDoc(path);
        const all = readAll();
        return (all[col]&&all[col][id]) ? JSON.parse(JSON.stringify(all[col][id])) : null;
      },
      docSet: async(path,data)=>{
        const {col,id} = splitDoc(path);
        const all = readAll(); all[col]=all[col]||{}; all[col][id]=data; writeAll(all);
        notify('doc:'+path); notify('col:'+col);
      },
      docUpdate: async(path,data)=>{
        const {col,id} = splitDoc(path);
        const all = readAll(); all[col]=all[col]||{};
        all[col][id] = Object.assign({}, all[col][id]||{}, data);
        writeAll(all);
        notify('doc:'+path); notify('col:'+col);
      },
      docOnSnapshot: (path,cb)=>{
        const {col,id} = splitDoc(path);
        const push = ()=>{ const all=readAll(); cb((all[col]&&all[col][id])?all[col][id]:null); };
        push();
        return subscribe('doc:'+path, push);
      },
      colGet: async(path)=> collDocs(path),
      colAdd: async(path,data)=>{
        const id = uid();
        const all = readAll(); all[path]=all[path]||{}; all[path][id]=data; writeAll(all);
        notify('col:'+path);
        return id;
      },
      colOnSnapshot: (path,cb)=>{
        const push=()=>cb(collDocs(path));
        push();
        return subscribe('col:'+path, push);
      }
    };
    function splitDoc(path){
      const parts = path.split('/');
      const id = parts.pop();
      return {col: parts.join('/'), id};
    }
  }

  function makeRealBackend(db){
    return {
      docGet: async(path)=>{ const s = await db.doc(path).get(); return s.exists ? s.data() : null; },
      docSet: async(path,data)=> db.doc(path).set(data),
      docUpdate: async(path,data)=>{
        try{ await db.doc(path).update(data); }
        catch(e){ await db.doc(path).set(data); }
      },
      docOnSnapshot: (path,cb)=> db.doc(path).onSnapshot(s=>cb(s.exists?s.data():null), ()=>{}),
      colGet: async(path)=>{ const s = await db.collection(path).get(); return s.docs.map(d=>({id:d.id,data:d.data()})); },
      colAdd: async(path,data)=>{ const ref = await db.collection(path).add(data); return ref.id; },
      colOnSnapshot: (path,cb)=> db.collection(path).onSnapshot(s=>cb(s.docs.map(d=>({id:d.id,data:d.data()}))), ()=>{})
    };
  }

  async function init(){
    if(!window.claude || typeof window.claude.use !== 'function'){
      backend = makeLocalBackend(); mode='local'; return mode;
    }
    try{
      const db = await window.claude.use('db');
      if(db){ backend = makeRealBackend(db); mode='cloud'; }
      else { backend = makeLocalBackend(); mode='local'; }
    }catch(e){ backend = makeLocalBackend(); mode='local'; }
    return mode;
  }

  return {
    init,
    mode: ()=>mode,
    doc: {
      get: (p)=>backend.docGet(p),
      set: (p,d)=>backend.docSet(p,d),
      update: (p,d)=>backend.docUpdate(p,d),
      onSnapshot: (p,cb)=>backend.docOnSnapshot(p,cb)
    },
    col: {
      get: (p)=>backend.colGet(p),
      add: (p,d)=>backend.colAdd(p,d),
      onSnapshot: (p,cb)=>backend.colOnSnapshot(p,cb)
    }
  };
})();

function requestsFor(employeeId){ return State.requests.filter(r=>r.data.employeeId===employeeId).sort((a,b)=> (b.data.createdAt||'').localeCompare(a.data.createdAt||'')); }

/* Cada día tiene hasta 4 checadas, siempre en este orden. */
const PUNCH_SEQUENCE = ['entrada','comida_salida','comida_regreso','salida'];
const PUNCH_LABEL = {entrada:'Entrada', comida_salida:'Salida a comer', comida_regreso:'Regreso de comida', salida:'Salida'};
const MIN_GAP_MINUTES = 5; // checadas más próximas que esto entre sí se marcan como posible error

function minutesBetween(t1, t2){
  const [h1,m1] = t1.split(':').map(Number);
  const [h2,m2] = t2.split(':').map(Number);
  return Math.abs((h2*60+m2) - (h1*60+m1));
}
function nextPunchType(dayData){
  return PUNCH_SEQUENCE.find(t => !dayData || !dayData[t] || !dayData[t].time);
}
function punchesSummary(dayData){
  return PUNCH_SEQUENCE.filter(t=> dayData[t] && dayData[t].time)
    .map(t=> `${PUNCH_LABEL[t]} ${dayData[t].time}${dayData[t].warn?' ⚠':''}`);
}

function dayStatus(employeeId, key){
  const now = new Date(); const d = fromKey(key);
  const isFuture = d > now && key !== dateKey(now);
  const isWeekend = d.getDay()===0 || d.getDay()===6;
  const ym = monthKeyOf(d);
  const doc = checkinDocFor(employeeId, ym);
  const dayData = doc && doc.data.days && doc.data.days[key];
  const req = State.requests.find(r=>r.data.employeeId===employeeId && r.data.date===key);

  if(isFuture) return {cls:'future', label:'Próximo'};
  if(dayData && dayData.entrada && dayData.entrada.time){
    return {cls:'present', label: punchesSummary(dayData).join(' · ')};
  }
  if(req){
    if(req.data.status==='pendiente') return {cls:'pending', label:(req.data.kind==='permiso'?'Permiso':'Justificación')+' pendiente'};
    if(req.data.status==='aprobado') return {cls: req.data.kind==='permiso'?'permit':'justified', label:(req.data.kind==='permiso'?'Permiso aprobado':'Justificado')};
    if(req.data.status==='rechazado' && !isWeekend) return {cls:'absent', label:'Solicitud rechazada'};
  }
  if(isWeekend) return {cls:'', label:'Fin de semana'};
  return {cls:'absent', label:'Falta'};
}

function todayCheckinCount(){
  const now = new Date(); const key = dateKey(now); const ym = monthKeyOf(now);
  let n=0;
  State.checkins.forEach(c=>{ if(c.data.yyyymm===ym && c.data.days && c.data.days[key] && c.data.days[key].entrada && c.data.days[key].entrada.time) n++; });
  return n;
}

/* ============================================================

============================================================ */
async function boot(){
  document.addEventListener('click', handleGlobalClick);
  const mode = await Store.init();
  try{ Downloads = window.claude ? await window.claude.use('downloads') : null; }catch(e){ Downloads = null; }

  await ensureSeed();
  subscribeAll();

  $('#boot').classList.add('hidden');
  const existing = loadSession();
  if(existing && (existing.role!=='empleado' || true)){
    State.session = existing;
  }
  // Un enlace guardado con #kiosk (ideal para dejar fijo en una tablet) entra
  // directo al checador público, sin pasar por el login.
  if(location.hash === '#kiosk' || location.hash === '#checador'){
    State.screen = 'kiosk';
  }
  render();

  setInterval(tickClock, 1000);
  tickClock();
}

async function ensureSeed(){
  const cfg = await Store.doc.get('config/app');
  if(!cfg){
    await Store.doc.set('config/app', {companyName:'Grupo Andes Retail', adminCode:'1234', createdAt: new Date().toISOString()});
  }
  const stores = await Store.col.get('stores');
  if(stores.length===0){
    await Store.col.add('stores', {name:'Sucursal Centro', code:'CTR-01'});
    await Store.col.add('stores', {name:'Sucursal Norte', code:'NTE-02'});
  }
}

function subscribeAll(){
  Store.doc.onSnapshot('config/app', (data)=>{
    if(data) State.config = Object.assign({}, State.config, data);
    render();
  });
  Store.col.onSnapshot('employees', (docs)=>{
    State.employees = docs.map(d=>({id:d.id, data:d.data})).sort((a,b)=>(a.data.name||'').localeCompare(b.data.name||''));
    render();
  });
  Store.col.onSnapshot('stores', (docs)=>{
    State.stores = docs.map(d=>({id:d.id, data:d.data})).sort((a,b)=>(a.data.name||'').localeCompare(b.data.name||''));
    render();
  });
  Store.col.onSnapshot('requests', (docs)=>{
    State.requests = docs.map(d=>({id:d.id, data:d.data}));
    render();
  });
  Store.col.onSnapshot('checkins', (docs)=>{
    State.checkins = docs.map(d=>({id:d.id, data:d.data}));
    render();
  });
}

function tickClock(){
  const now = new Date();
  const timeStr2 = now.toLocaleTimeString('es-MX',{hour12:false});
  const dateStr = now.toLocaleDateString('es-MX',{weekday:'long', day:'numeric', month:'long'});
  const c = $('#clockNow'); const cd = $('#clockDate');
  if(c) c.textContent = timeStr2;
  if(cd) cd.textContent = dateStr;
  const kc = $('#kioskClockNow'); const kcd = $('#kioskClockDate');
  if(kc) kc.textContent = timeStr2;
  if(kcd) kcd.textContent = dateStr;
}

/* ============================================================
   RENDER ROOT — switches gate vs shell
============================================================ */
function render(){
  if(State.screen==='kiosk'){
    $('#gate').classList.add('hidden');
    $('#shell').classList.add('hidden');
    $('#kioskScreen').classList.remove('hidden');
    renderKioskScreen();
    return;
  }
  $('#kioskScreen').classList.add('hidden');
  if(!State.session){
    $('#gate').classList.remove('hidden');
    $('#shell').classList.add('hidden');
    renderGate();
  } else {
    $('#gate').classList.add('hidden');
    $('#shell').classList.remove('hidden');
    renderShell();
  }
}

// how many times the rail/topbar are re-rendered — no risk of a stale/missing listener.
function handleGlobalClick(e){
  const logoutBtn = e.target.closest('[data-logout]');
  if(logoutBtn){ kioskTeardown(); clearSession(); render(); return; }
  const kioskBtn = e.target.closest('[data-open-kiosk]');
  if(kioskBtn){ openKioskScreen(); return; }
  const fsBtn = e.target.closest('[data-kiosk-fs]');
  if(fsBtn){ requestKioskFullscreen(); return; }
  const exitBtn = e.target.closest('[data-kiosk-exit]');
  if(exitBtn){ closeKioskScreen(); }
}

/* ============================================================
   CÁMARA — kiosco de check-in facial simulado.
   La cámara se activa sola al entrar a la vista y queda transmitiendo
   en vivo; "Validar" captura, verifica y registra la checada en un
   solo paso, mostrando de inmediato nombre, tipo de checada y hora.
============================================================ */
// Estados: idle | starting | live | picking | verifying | result | done | error
const Kiosk = {stream:null, state:'idle', errorMsg:'', result:null, containerId:null, token:0, search:''};

function kioskMount(containerId){
  if(Kiosk.containerId === containerId){
    // Ya montado en este contenedor (un refresco de datos volvió a dibujar
    // la pantalla alrededor) — solo repinta el estado ACTUAL, sin cortar la
    // transmisión ni interrumpir un resultado en pantalla.
    kioskRender();
    return;
  }
  kioskTeardown();
  Kiosk.token++;
  const myToken = Kiosk.token;
  Kiosk.containerId = containerId;
  Kiosk.state = 'idle'; Kiosk.result = null; Kiosk.errorMsg = ''; Kiosk.search = '';
  kioskRender();
  kioskStart(myToken);
}
function kioskTeardown(){
  Kiosk.token++;
  if(Kiosk.stream){ try{ Kiosk.stream.getTracks().forEach(t=>t.stop()); }catch(e){} Kiosk.stream=null; }
  Kiosk.containerId = null; Kiosk.state = 'idle'; Kiosk.result = null;
}
async function kioskStart(myToken){
  Kiosk.state = 'starting'; kioskRender();
  try{
    const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}, audio:false});
    if(myToken !== Kiosk.token){ stream.getTracks().forEach(t=>t.stop()); return; }
    Kiosk.stream = stream; Kiosk.state = 'live'; kioskRender();
  }catch(err){
    if(myToken !== Kiosk.token) return;
    Kiosk.state = 'error'; Kiosk.errorMsg = (err && err.message) || 'No se pudo acceder a la cámara.'; kioskRender();
  }
}
function kioskOpenPicker(){
  if(Kiosk.state !== 'live') return;
  Kiosk.search = '';
  Kiosk.state = 'picking';
  kioskRender();
}
async function kioskPickEmployee(employeeId){
  const emp = employeeById(employeeId);
  if(!emp) return;
  const myToken = Kiosk.token;
  Kiosk.state = 'verifying'; kioskRender();
  await new Promise(r=>setTimeout(r, 650));
  if(myToken !== Kiosk.token) return;
  const container = document.getElementById(Kiosk.containerId);
  const video = container && container.querySelector('#kioskVideo');
  const snap = video ? compressImage(video, 240, 0.72) : null;
  const res = await registerCheckin(emp, snap);
  if(myToken !== Kiosk.token) return;
  if(res){ Kiosk.result = Object.assign({employeeName: emp.data.name}, res); Kiosk.state = 'result'; }
  else { Kiosk.state = 'done'; }
  kioskRender();
  setTimeout(()=>{
    if(myToken !== Kiosk.token) return;
    Kiosk.state = Kiosk.stream ? 'live' : 'idle';
    Kiosk.result = null;
    kioskRender();
  }, 2600);
}
function kioskRender(){
  if(!Kiosk.containerId) return;
  const container = document.getElementById(Kiosk.containerId);
  if(!container) return;

  const showVideo = (Kiosk.state==='live' || Kiosk.state==='picking' || Kiosk.state==='verifying') && Kiosk.stream;

  let center;
  if(Kiosk.state==='error'){
    center = `<div class="kiosk-center-msg">
      <div class="kiosk-big-icon">${icon('alert')}</div>
      <div class="kiosk-msg-title">No se pudo acceder a la cámara</div>
      <div class="kiosk-msg-sub">${escapeHtml(Kiosk.errorMsg)}</div>
      <button type="button" class="btn btn-accent" data-kiosk-retry style="margin-top:18px;">${icon('camera')} Reintentar</button>
    </div>`;
  } else if(Kiosk.state==='starting' || Kiosk.state==='idle'){
    center = `<div class="kiosk-center-msg"><div class="kiosk-big-icon">${icon('camera')}</div><div class="kiosk-msg-title">Iniciando cámara…</div></div>`;
  } else if(Kiosk.state==='result' && Kiosk.result){
    const r = Kiosk.result;
    center = `<div class="kiosk-result">
      <div class="kiosk-check">${icon('check')}</div>
      <div class="kiosk-result-name">${escapeHtml(r.employeeName)}</div>
      <div class="kiosk-result-type">${escapeHtml(r.label)}</div>
      <div class="kiosk-result-time mono">${escapeHtml(r.time)}</div>
      ${r.warn? `<div class="kiosk-result-warn">${icon('alert')} Muy cercana a tu checada anterior — verifica si fue correcta</div>`:''}
    </div>`;
  } else if(Kiosk.state==='done'){
    center = `<div class="kiosk-center-msg"><div class="kiosk-big-icon" style="color:var(--success);opacity:1;">${icon('check')}</div><div class="kiosk-msg-title">Ya completaste tus 4 checadas de hoy</div></div>`;
  } else if(Kiosk.state==='verifying'){
    center = `<div class="kiosk-center-msg"><div class="kiosk-verifying-ring"></div><div class="kiosk-msg-title">Verificando…</div></div>`;
  } else if(Kiosk.state==='picking'){
    center = kioskPickerHtml();
  } else if(Kiosk.state==='live'){
    center = `<div class="kiosk-tap-hint">
      <div class="kiosk-tap-icon">${icon('check')}</div>
      <div class="kiosk-msg-title">Toca la pantalla para marcar tu asistencia</div>
      <div class="kiosk-msg-sub">Ubica tu rostro en la cámara y toca en cualquier parte</div>
    </div>`;
  } else {
    center = '';
  }

  container.innerHTML = `
    ${showVideo ? '<video id="kioskVideo" autoplay playsinline muted class="kiosk-video-bg"></video>' : ''}
    <div class="kiosk-scrim ${Kiosk.state==='picking'?'kiosk-scrim-strong':''}"></div>
    <div class="kiosk-overlay" id="kioskOverlay">
      <div class="kiosk-topbar">
        <div class="kiosk-brand-mini">
          <div class="mark">${icon('clock')}</div>
          <div>
            <div class="kb-title">Checador</div>
            <div class="kb-sub">${escapeHtml(State.config.companyName||'')}</div>
          </div>
        </div>
        <div style="display:flex;align-items:center;">
          <div>
            <div class="kiosk-clock mono" id="kioskClockNow">00:00:00</div>
            <div class="kiosk-date" id="kioskClockDate"></div>
          </div>
          <button class="kiosk-exit" data-kiosk-fs title="Pantalla completa">${icon('expand')}</button>
          <button class="kiosk-exit" data-kiosk-exit title="Salir del checador (RH / Jefe)">${icon('x')}</button>
        </div>
      </div>
      <div class="kiosk-center">${center}</div>
    </div>
  `;

  if(showVideo){
    const v = container.querySelector('#kioskVideo');
    if(v && v.srcObject !== Kiosk.stream) v.srcObject = Kiosk.stream;
  }
  if(Kiosk.state==='picking'){
    const s = container.querySelector('#kioskSearch');
    if(s){ s.focus(); const p = s.value.length; s.setSelectionRange(p, p); }
  }

  const overlay = container.querySelector('#kioskOverlay');
  overlay.addEventListener('click', (e)=>{
    if(e.target.closest('[data-kiosk-fs],[data-kiosk-exit]')) return;
    if(Kiosk.state==='live'){ kioskOpenPicker(); return; }
    if(Kiosk.state==='picking' && !e.target.closest('.kiosk-picker')){ Kiosk.state='live'; kioskRender(); }
  });
  const retryBtn = container.querySelector('[data-kiosk-retry]');
  if(retryBtn) retryBtn.addEventListener('click', (e)=>{ e.stopPropagation(); kioskStart(Kiosk.token); });

  if(Kiosk.state==='picking') bindKioskPicker(container);

  tickClock();
}
function kioskPickerHtml(){
  const q = Kiosk.search.trim().toLowerCase();
  const list = State.employees.filter(e => !q || (e.data.name||'').toLowerCase().includes(q));

function bindKioskPicker(container){
  const search = container.querySelector('#kioskSearch');

  container.querySelectorAll('[data-pick]').forEach(b=>{

async function registerCheckin(emp, snapshotDataUrl){
  const now = new Date();
  const key = dateKey(now); const ym = monthKeyOf(now);
  const docId = `${emp.id}__${ym}`;
  const existing = checkinDocFor(emp.id, ym);
  const days = existing ? Object.assign({}, existing.data.days) : {};
  const today = days[key] ? Object.assign({}, days[key]) : {};
  const storeId = emp.data.storeIds && emp.data.storeIds[0];
  const store = storeId ? State.stores.find(s=>s.id===storeId) : null;

  const type = nextPunchType(today);
  if(!type){
    toast(`${emp.data.name} ya completó sus 4 checadas de hoy (entrada, salida a comer, regreso, salida).`, 'err');
    return null;
  }
  const idx = PUNCH_SEQUENCE.indexOf(type);
  let prevTime = null;
  for(let i=idx-1; i>=0; i--){
    const t = PUNCH_SEQUENCE[i];
    if(today[t] && today[t].time){ prevTime = today[t].time; break; }
  }
  const nowTime = timeStr(now);
  const warn = !!(prevTime && minutesBetween(prevTime, nowTime) < MIN_GAP_MINUTES);

  today[type] = {time: nowTime, warn};
  today.storeId = storeId||null;
  today.storeName = store? store.data.name : (emp.data.storeIds&&emp.data.storeIds.length>1?'Varias tiendas':'—');
  days[key] = today;
  await Store.doc.set(`checkins/${docId}`, {employeeId: emp.id, yyyymm: ym, days});

  toast(`${PUNCH_LABEL[type]} registrada para ${emp.data.name} · ${nowTime}`, warn?'err':'ok');
  if(warn) toast(`Posible error de checada: solo pasaron ${minutesBetween(prevTime, nowTime)} min desde tu checada anterior (${prevTime})`, 'err');

  return {type, label: PUNCH_LABEL[type], time: nowTime, warn};
}

function bindSolicitudesView(withExport){
  $$('[data-approve]').forEach(b=> b.addEventListener('click', ()=>resolveRequest(b.dataset.approve,'aprobado')));
  $$('[data-reject]').forEach(b=> b.addEventListener('click', ()=>resolveRequest(b.dataset.reject,'rechazado')));
  if(withExport){
    const btn = $('#btnExportCsv');
    if(btn) btn.addEventListener('click', exportPayrollCsv);
  }
}
async function resolveRequest(reqId, status){
  await Store.doc.update(`requests/${reqId}`, {
    status, reviewedBy: State.session.name, reviewerRole: State.session.role, reviewedAt: new Date().toISOString()
  });
  toast(status==='aprobado'?'Solicitud aprobada':'Solicitud rechazada', status==='aprobado'?'ok':'info');
}

async function exportPayrollCsv(){
  const rows = [['Empleado','Tipo','Fecha','Hora inicio','Hora fin','Motivo','Estatus','Revisó']];
  State.requests.forEach(r=>{
    rows.push([r.data.employeeName, r.data.kind==='permiso'?'Permiso':'Justificación', r.data.date, r.data.hourFrom||'', r.data.hourTo||'', (r.data.reason||'').replace(/[\r\n,]+/g,' '), r.data.status, r.data.reviewedBy||'']);
  });
  const csv = rows.map(row=> row.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const filename = `nomina_solicitudes_${dateKey(new Date())}.csv`;
  try{
    if(Downloads){
      await Downloads.save({filename, data: csv});
      toast('CSV exportado','ok');
    } else if(!window.claude){
      const blob = new Blob([csv],{type:'text/csv;charset=utf-8;'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 2000);
      toast('CSV descargado','ok');
    } else {
      toast('La descarga no está disponible en esta vista','err');
    }
  }catch(err){
    if(err && err.code==='declined'){ toast('Descarga cancelada','info'); }
    else toast('No se pudo exportar el CSV','err');
  }
}

  if(today.comida_salida && today.comida_salida.time && !(today.comida_regreso && today.comida_regreso.time)) return `<span class="pill pill-info">En comida</span>`;
  return `<span class="pill pill-success">${icon('check')} En turno</span>`;
}

/* ============================================================
   EMPLEADO — calendario
============================================================ */
function renderCalendarioView(v){
  v.innerHTML = viewCalendario();
  bindCalendarioView();
}
function viewCalendario(){
  const emp = employeeById(State.session.employeeId);
  const cm = State.calMonth;
  const y = cm.getFullYear(), m = cm.getMonth();
  const first = new Date(y,m,1);
  const startOffset = first.getDay();
  const daysInMonth = new Date(y,m+1,0).getDate();
  let cells = '';
  for(let i=0;i<startOffset;i++) cells += `<div class="cal-cell empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dt = new Date(y,m,d);
    const key = dateKey(dt);
    const st = dayStatus(emp.id, key);
    const isToday = key===dateKey(new Date());
    const isWeekend = dt.getDay()===0||dt.getDay()===6;
    cells += `<div class="cal-cell ${st.cls} ${isToday?'today':''} ${isWeekend?'weekend':''}" data-day="${key}" title="${escapeHtml(st.label)}">
      <div class="cd-num">${d}</div>${st.cls?`<div class="cd-dot"></div>`:''}
    </div>`;
  }
  return `
    <div class="panel">
      <div class="cal-head">
        <div class="cal-month">${MONTHS[m]} ${y}</div>
        <div class="cal-nav">
          <button id="calPrev">${icon('chevL')}</button>
          <button id="calToday" class="btn-sm" style="width:auto;padding:0 10px;">Hoy</button>
          <button id="calNext">${icon('chevR')}</button>
        </div>
      </div>
      <div class="cal-grid">
        ${DOW.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
        ${cells}
      </div>
      <div class="legend">
        <span><i style="background:var(--success)"></i>Presente</span>
        <span><i style="background:var(--danger)"></i>Falta</span>
        <span><i style="background:var(--info)"></i>Justificado</span>
        <span><i style="background:var(--warn)"></i>Permiso</span>
        <span><i style="background:var(--ink-soft)"></i>Pendiente de revisión</span>
      </div>
      <div class="field-hint" style="margin-top:10px;">Toca un día para solicitar justificación o permiso.</div>
    </div>
  `;
}
function bindCalendarioView(){
  $('#calPrev').addEventListener('click', ()=>{ State.calMonth = new Date(State.calMonth.getFullYear(), State.calMonth.getMonth()-1, 1); renderCalendarioView($('#view')); });
  $('#calNext').addEventListener('click', ()=>{ State.calMonth = new Date(State.calMonth.getFullYear(), State.calMonth.getMonth()+1, 1); renderCalendarioView($('#view')); });
  $('#calToday').addEventListener('click', ()=>{ State.calMonth = new Date(); renderCalendarioView($('#view')); });
  $$('.cal-cell[data-day]').forEach(c=> c.addEventListener('click', ()=> openRequestModal(c.dataset.day)));
}

function openRequestModal(dateKeyStr){
  const emp = employeeById(State.session.employeeId);
  openModal({
    title:`Solicitud · ${dateKeyStr}`,
    bodyHtml:`
      <div class="field">
        <label>Tipo de solicitud</label>
        <div class="seg" id="reqKindSeg">
          <button type="button" class="active" data-kind="justificacion">Justificar checada</button>
          <button type="button" data-kind="permiso">Pedir permiso</button>
        </div>
      </div>
      <div class="row-2">
        <div class="field"><label>Hora desde (opcional)</label><input type="time" id="reqFrom"/></div>
        <div class="field"><label>Hora hasta (opcional)</label><input type="time" id="reqTo"/></div>
      </div>
      <div class="field"><label>Motivo</label><textarea id="reqReason" rows="3" placeholder="Explica brevemente el motivo…"></textarea></div>
      <div class="field-hint">${icon('alert')} Se enviará a tu jefe inmediato y a RH para autorización y control de nómina.</div>
    `,
    footHtml:`<button class="btn btn-ghost" data-close type="button">Cancelar</button><button class="btn btn-primary" id="reqSend" type="button">Enviar solicitud</button>`
  });
  let kind='justificacion';
  $$('#reqKindSeg button').forEach(b=> b.addEventListener('click', ()=>{ kind=b.dataset.kind; $$('#reqKindSeg button').forEach(x=>x.classList.toggle('active', x===b)); }));
  $('#reqSend').addEventListener('click', async()=>{
    const reason = ($('#reqReason').value||'').trim();
    if(!reason){ toast('Describe el motivo de tu solicitud','err'); return; }
    await Store.col.add('requests', {
      employeeId: emp.id, employeeName: emp.data.name, kind, date: dateKeyStr,
      hourFrom: $('#reqFrom').value||'', hourTo: $('#reqTo').value||'', reason,
      status:'pendiente', createdAt: new Date().toISOString()
    });
    toast('Solicitud enviada a tu jefe inmediato y RH','ok');
    closeModal();
  });
}

      <div class="modal">
        <div class="modal-head"><h3>${escapeHtml(title)}</h3><button class="modal-close" data-close>${icon('x')}</button></div>
        <div class="modal-body">${bodyHtml}</div>
        <div class="modal-foot">${footHtml}</div>
